name: render-sea
on:
  workflow_dispatch:
    inputs:
      levels:
        description: "Sea level rise in metres, comma separated"
        default: "1,10,30,66,200,500,1000"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: check file
        run: |
          wc -l sea.js
          sha1sum sea.js
          node --check sea.js && echo SYNTAX_OK
      - name: install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: install node packages
        run: npm install three@0.149.0 playwright@1.48.0
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: render video
        env:
          LEVELS: ${{ github.event.inputs.levels }}
        run: node sea.js
      - uses: actions/upload-artifact@v4
        with:
          name: sea-video
          path: videos/sea_level.mp4
