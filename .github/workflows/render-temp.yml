name: render-temp
on:
  workflow_dispatch:
    inputs:
      temps:
        description: "Temperatures in C, comma separated"
        default: "50,100,300,1000,3000,5500"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: check file
        run: |
          wc -l temp.js
          sha1sum temp.js
          node --check temp.js && echo SYNTAX_OK
      - name: install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: install node packages
        run: npm install three@0.149.0 playwright@1.48.0
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: render video
        env:
          TEMPS: ${{ github.event.inputs.temps }}
        run: node temp.js
      - uses: actions/upload-artifact@v4
        with:
          name: temp-video
          path: videos/temperature.mp4
